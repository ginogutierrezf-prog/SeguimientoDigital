<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard Cobranza Digital · Mayo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f1f4f8;
    --surface:   #ffffff;
    --surface2:  #f7f9fc;
    --surface3:  #edf0f5;
    --border:    #e2e7ef;
    --border2:   #c9d2e0;
    --bcp:       #1a5fd4;
    --bcp-glow:  rgba(26,95,212,0.13);
    --bcp-pale:  rgba(26,95,212,0.07);
    --yape:      #e0500a;
    --yape-glow: rgba(224,80,10,0.13);
    --yape-pale: rgba(224,80,10,0.07);
    --green:     #15803d;
    --green-bg:  rgba(21,128,61,0.09);
    --red:       #b91c1c;
    --red-bg:    rgba(185,28,28,0.09);
    --amber:     #b45309;
    --text:      #111827;
    --text2:     #374151;
    --text3:     #6b7280;
    --text4:     #9ca3af;
    --sans:  'Plus Jakarta Sans', sans-serif;
    --mono:  'JetBrains Mono', monospace;
    --shadow:    0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.09);
    --radius: 11px;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

  /* ══════════════════════════════════════
     HEADER
  ══════════════════════════════════════ */
  .header {
    padding:12px 16px; border-bottom:1px solid var(--border);
    background:var(--surface); position:sticky; top:0; z-index:200;
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .header-left { display:flex; align-items:center; gap:11px; min-width:0; }
  .header-logo {
    width:32px; height:32px; flex-shrink:0;
    background:linear-gradient(135deg,var(--bcp) 0%,var(--yape) 100%);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:#fff; letter-spacing:-0.5px;
  }
  .header-title { font-size:15px; font-weight:700; color:var(--text); letter-spacing:-0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-sub   { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:1px; display:none; }
  .header-badges { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .hbadge { font-family:var(--mono); font-size:10px; font-weight:500; padding:3px 9px; border-radius:20px; border:1px solid var(--border2); color:var(--text2); background:var(--surface2); white-space:nowrap; }
  .corte-badge { font-family:var(--mono); font-size:10px; font-weight:600; color:var(--green); border:1px solid rgba(21,128,61,.28); background:rgba(21,128,61,.07); padding:3px 10px; border-radius:20px; white-space:nowrap; }

  /* ══════════════════════════════════════
     MOBILE NAV DRAWER
  ══════════════════════════════════════ */
  .hamburger {
    display:none; flex-direction:column; gap:4px; padding:6px;
    background:none; border:none; cursor:pointer; border-radius:6px;
    transition:background 0.15s;
  }
  .hamburger:hover { background:var(--surface2); }
  .hamburger span { display:block; width:20px; height:2px; background:var(--text2); border-radius:2px; transition:all 0.2s; }
  .hamburger.open span:nth-child(1) { transform:translateY(6px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity:0; }
  .hamburger.open span:nth-child(3) { transform:translateY(-6px) rotate(-45deg); }

  .drawer-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4);
    z-index:150; opacity:0; transition:opacity 0.25s;
  }
  .drawer-overlay.open { display:block; opacity:1; }

  /* ══════════════════════════════════════
     LAYOUT
  ══════════════════════════════════════ */
  .main { display:flex; height:calc(100vh - 57px); overflow:hidden; }

  /* ══════════════════════════════════════
     LEFT NAV (desktop sidebar / mobile drawer)
  ══════════════════════════════════════ */
  .left-panel {
    width:268px; min-width:268px;
    background:var(--surface); border-right:1px solid var(--border);
    overflow-y:auto; padding:16px 0;
    transition:transform 0.25s ease;
    flex-shrink:0;
  }
  .left-panel::-webkit-scrollbar { width:3px; }
  .left-panel::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  .nav-label { font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:2px; color:var(--text4); text-transform:uppercase; padding:0 16px 9px; }
  .entity-tabs { display:flex; gap:6px; padding:0 11px 15px; }
  .entity-tab { flex:1; padding:9px 6px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:700; color:var(--text3); transition:all 0.16s; text-align:center; }
  .entity-tab.bcp.active  { color:var(--bcp);  border-color:var(--bcp);  background:var(--bcp-pale);  box-shadow:0 0 0 3px rgba(26,95,212,.08); }
  .entity-tab.yape.active { color:var(--yape); border-color:var(--yape); background:var(--yape-pale); box-shadow:0 0 0 3px rgba(224,80,10,.08); }
  .entity-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; background:currentColor; }

  .tramo-tree { padding:0 5px; }
  .tramo-item { margin-bottom:2px; }
  .tramo-btn { width:100%; display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; background:transparent; border:none; cursor:pointer; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--text2); text-align:left; transition:all 0.13s; }
  .tramo-btn:hover { background:var(--surface2); }
  .tramo-btn.active-bcp  { background:var(--bcp-pale);  color:var(--bcp); }
  .tramo-btn.active-yape { background:var(--yape-pale); color:var(--yape); }
  .tramo-icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--mono); font-weight:600; flex-shrink:0; background:var(--surface3); color:var(--text3); transition:all 0.13s; }
  .tramo-btn.active-bcp  .tramo-icon { background:var(--bcp-glow);  color:var(--bcp); }
  .tramo-btn.active-yape .tramo-icon { background:var(--yape-glow); color:var(--yape); }
  .tramo-label { flex:1; line-height:1.2; }
  .tramo-desc { font-size:10px; color:var(--text4); font-weight:400; font-family:var(--mono); display:block; margin-top:1px; }
  .chevron { font-size:9px; color:var(--text4); transition:transform 0.18s; }
  .tramo-btn.expanded .chevron { transform:rotate(90deg); }

  .sub-items { display:none; margin-left:14px; padding-left:10px; border-left:2px solid var(--border); margin-top:1px; margin-bottom:1px; }
  .sub-items.open { display:block; }
  .sub-btn { width:100%; display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; background:transparent; border:none; cursor:pointer; font-family:var(--mono); font-size:11px; font-weight:400; color:var(--text3); text-align:left; transition:all 0.11s; margin-bottom:1px; }
  .sub-btn:hover { background:var(--surface2); color:var(--text2); }
  .sub-btn.active-bcp  { background:var(--bcp-pale);  color:var(--bcp);  font-weight:600; }
  .sub-btn.active-yape { background:var(--yape-pale); color:var(--yape); font-weight:600; }
  .sub-dot { width:4px; height:4px; border-radius:50%; background:currentColor; flex-shrink:0; }

  .subsub-items { display:none; margin-left:10px; padding-left:8px; border-left:1px dashed var(--border2); margin-top:1px; }
  .subsub-items.open { display:block; }
  .subsub-btn { width:100%; display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:5px; background:transparent; border:none; cursor:pointer; font-family:var(--mono); font-size:10px; font-weight:400; color:var(--text4); text-align:left; transition:all 0.1s; margin-bottom:1px; }
  .subsub-btn:hover { background:var(--surface2); color:var(--text2); }
  .subsub-btn.active-bcp  { background:var(--bcp-pale);  color:var(--bcp); }
  .subsub-btn.active-yape { background:var(--yape-pale); color:var(--yape); }

  .divider { height:1px; background:var(--border); margin:9px 11px; }
  .group-badge { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text4); padding:2px 14px 6px; }

  /* ══════════════════════════════════════
     RIGHT PANEL
  ══════════════════════════════════════ */
  .right-panel { flex:1; overflow-y:auto; padding:20px 16px; background:var(--bg); min-width:0; }
  .right-panel::-webkit-scrollbar { width:3px; }
  .right-panel::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  /* ══════════════════════════════════════
     BREADCRUMB
  ══════════════════════════════════════ */
  .breadcrumb { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; font-weight:500; color:var(--text4); margin-bottom:14px; flex-wrap:wrap; }
  .bc-sep { color:var(--border2); }
  .bc-item.current { color:var(--text2); font-weight:600; }
  .bc-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:3px; flex-shrink:0; }
  .bc-dot.bcp  { background:var(--bcp); }
  .bc-dot.yape { background:var(--yape); }

  /* ══════════════════════════════════════
     SECTION HEADER
  ══════════════════════════════════════ */
  .section-header { display:flex; align-items:flex-end; gap:12px; margin-bottom:14px; }
  .section-title { font-size:26px; font-weight:800; letter-spacing:-1px; line-height:1; }
  .section-title.bcp  { color:var(--bcp); }
  .section-title.yape { color:var(--yape); }
  .section-subtitle { font-family:var(--mono); font-size:11px; font-weight:500; color:var(--text3); padding-bottom:3px; }

  /* ══════════════════════════════════════
     INSIGHT STRIP
  ══════════════════════════════════════ */
  .insight-strip { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .insight-chip { display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:7px; background:var(--surface); border:1px solid var(--border); font-family:var(--mono); font-size:10.5px; font-weight:500; color:var(--text2); box-shadow:var(--shadow); }
  .ic-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .ic-dot.bcp  { background:var(--bcp); }
  .ic-dot.yape { background:var(--yape); }

  /* ══════════════════════════════════════
     WIN/LOSS BANNER
  ══════════════════════════════════════ */
  .wl-banner { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:9px; margin-bottom:14px; font-size:13px; font-weight:600; border:1.5px solid; }
  .wl-banner.winning { background:var(--green-bg); border-color:rgba(21,128,61,.28); color:var(--green); }
  .wl-banner.losing  { background:var(--red-bg);   border-color:rgba(185,28,28,.28); color:var(--red); }
  .wl-banner.tied    { background:rgba(180,83,9,.07); border-color:rgba(180,83,9,.28); color:var(--amber); }
  .wl-icon { font-size:16px; flex-shrink:0; }
  .wl-text { flex:1; font-size:12px; line-height:1.3; }
  .wl-diff { font-family:var(--mono); font-size:12px; font-weight:700; padding:2px 9px; border-radius:6px; background:rgba(255,255,255,0.65); white-space:nowrap; }

  /* ══════════════════════════════════════
     KPI CARDS
  ══════════════════════════════════════ */
  .kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 12px; position:relative; overflow:hidden; box-shadow:var(--shadow); transition:box-shadow 0.16s; }
  .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:var(--radius) var(--radius) 0 0; }
  .kpi-card.bcp::before  { background:var(--bcp); }
  .kpi-card.yape::before { background:var(--yape); }
  .kpi-label { font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text3); margin-bottom:7px; }
  .kpi-value { font-size:22px; font-weight:800; letter-spacing:-0.8px; line-height:1; margin-bottom:4px; }
  .kpi-card.bcp  .kpi-value { color:var(--bcp); }
  .kpi-card.yape .kpi-value { color:var(--yape); }
  .kpi-sub { font-family:var(--mono); font-size:10px; font-weight:400; color:var(--text3); line-height:1.3; }
  .kpi-trad { display:flex; align-items:center; gap:5px; margin-top:7px; padding-top:7px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .kpi-trad-label { font-family:var(--mono); font-size:9.5px; font-weight:500; color:var(--text3); }
  .kpi-trad-val   { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text2); }

  /* ══════════════════════════════════════
     PILLS
  ══════════════════════════════════════ */
  .pill { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10.5px; font-weight:600; font-family:var(--mono); white-space:nowrap; }
  .pill.bcp   { background:var(--bcp-pale);  color:var(--bcp); }
  .pill.yape  { background:var(--yape-pale); color:var(--yape); }
  .pill.trad  { background:var(--surface3);  color:var(--text2); }
  .pill.na    { background:var(--surface3);  color:var(--text3); }
  .pill.win   { background:var(--green-bg);  color:var(--green); }
  .pill.loss  { background:var(--red-bg);    color:var(--red); }
  .pill.tie   { background:rgba(180,83,9,.09); color:var(--amber); }

  /* ══════════════════════════════════════
     DATA TABLE (scrollable on mobile)
  ══════════════════════════════════════ */
  .data-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:16px; }
  .data-section-header { padding:11px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--surface2); }
  .data-section-title { font-size:13px; font-weight:700; color:var(--text); flex:1; }
  .data-badge { font-family:var(--mono); font-size:9.5px; font-weight:500; padding:2px 7px; border-radius:4px; border:1px solid var(--border2); color:var(--text3); white-space:nowrap; }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; min-width:560px; }
  thead tr { background:var(--surface2); }
  th { font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; color:var(--text3); padding:8px 11px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border); }
  th:first-child { text-align:left; }
  tbody tr { border-top:1px solid var(--border); transition:background 0.09s; }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover { background:var(--surface2); }
  td { padding:10px 11px; font-family:var(--mono); font-size:11.5px; font-weight:500; color:var(--text2); text-align:right; white-space:nowrap; }
  td:first-child { text-align:left; color:var(--text); font-weight:700; font-family:var(--sans); font-size:13px; }
  .val-bcp  { color:var(--bcp)  !important; font-weight:700; }
  .val-yape { color:var(--yape) !important; font-weight:700; }
  .gap-cell { text-align:center !important; }

  /* ══════════════════════════════════════
     CHARTS
  ══════════════════════════════════════ */
  .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 12px; box-shadow:var(--shadow); min-width:0; }
  .chart-title { font-size:12px; font-weight:700; color:var(--text); font-family:var(--sans); margin-bottom:3px; line-height:1.3; }
  .chart-sub   { font-family:var(--mono); font-size:9.5px; font-weight:500; color:var(--text3); margin-bottom:12px; line-height:1.3; }
  canvas { display:block; width:100% !important; }

  /* ══════════════════════════════════════
     NO DATA
  ══════════════════════════════════════ */
  .no-data { padding:36px 20px; text-align:center; font-family:var(--mono); font-size:12px; color:var(--text3); }
  .no-data span { display:block; font-size:22px; margin-bottom:8px; }

  /* ══════════════════════════════════════
     ANIMATIONS
  ══════════════════════════════════════ */
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .animate   { animation:fadeUp 0.24s ease both; }
  .animate-1 { animation-delay:.04s; }
  .animate-2 { animation-delay:.08s; }
  .animate-3 { animation-delay:.13s; }
  .animate-4 { animation-delay:.18s; }

  /* ══════════════════════════════════════
     RESPONSIVE BREAKPOINTS
  ══════════════════════════════════════ */

  /* Tablet: nav collapses to drawer */
  @media (max-width: 900px) {
    .hamburger { display:flex; }
    .header-sub { display:none; }

    .left-panel {
      position:fixed; left:0; top:57px; bottom:0;
      z-index:160; transform:translateX(-100%);
      box-shadow:var(--shadow-md);
    }
    .left-panel.open { transform:translateX(0); }
    .main { height:calc(100vh - 57px); }
  }

  /* Small tablet */
  @media (max-width: 768px) {
    .charts-row { grid-template-columns:1fr; }
    .kpi-grid   { grid-template-columns:repeat(2,1fr); }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .header { padding:10px 12px; }
    .header-title { font-size:14px; }
    .hbadge { display:none; }

    .right-panel { padding:14px 12px; }

    .kpi-grid { grid-template-columns:1fr 1fr; gap:8px; }
    .kpi-value { font-size:19px; }
    .kpi-label { font-size:9px; }

    .section-title { font-size:22px; }
    .section-subtitle { font-size:10px; }

    .wl-text { font-size:11px; }
    .wl-diff { font-size:11px; }

    .charts-row { grid-template-columns:1fr; gap:10px; }

    .insight-chip { font-size:10px; padding:5px 9px; }
  }

  /* Very small screens */
  @media (max-width: 360px) {
    .kpi-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="hamburger" id="hamburger" onclick="toggleDrawer()" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="header-logo">CD</div>
    <div>
      <div class="header-title">Cobranza Digital</div>
      <div class="header-sub">BCP &amp; Yape · Mayo 2026</div>
    </div>
  </div>
  <div class="header-badges">
    <div class="hbadge">MAYO 2026</div>
    <div class="corte-badge">● 07/05</div>
  </div>
</header>

<!-- OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<div class="main">
  <!-- LEFT NAV -->
  <nav class="left-panel" id="leftPanel">
    <div style="padding:0 11px 13px;">
      <div class="nav-label">Entidad</div>
      <div class="entity-tabs">
        <button class="entity-tab bcp active" id="tab-bcp" onclick="setEntity('bcp')"><span class="entity-dot"></span>BCP</button>
        <button class="entity-tab yape"        id="tab-yape" onclick="setEntity('yape')"><span class="entity-dot"></span>Yape</button>
      </div>
    </div>
    <div class="tramo-tree">
      <div class="nav-label">Tramos de Mora</div>
      <!-- TOTAL -->
      <div class="tramo-item">
        <button class="tramo-btn" id="nav-total" onclick="navAndClose('total')">
          <div class="tramo-icon">∑</div>
          <div class="tramo-label">Total General<span class="tramo-desc">Vista consolidada</span></div>
        </button>
      </div>
      <div class="divider"></div>
      <div class="group-badge">Grupo 1–120</div>
      <!-- 1-30 -->
      <div class="tramo-item">
        <button class="tramo-btn" id="nav-1-30" onclick="toggleTramo('1-30')">
          <div class="tramo-icon">30</div>
          <div class="tramo-label">Tramo 1–30<span class="tramo-desc">Por Segmentos A/B/C/D</span></div>
          <span class="chevron">▶</span>
        </button>
        <div class="sub-items" id="sub-1-30">
          <button class="sub-btn" id="nav-1-30-total" onclick="navAndClose('1-30-total')"><span class="sub-dot"></span>Resumen tramo</button>

function toggleDrawer(){

}

const fmt={
  num: v=>v==null?'—':v.toLocaleString('es-PE'),
  pct: v=>v==null?'—':(v*100).toFixed(1)+'%',
  mm:  v=>v==null?'—':'S/ '+v.toFixed(2)+' MM',
};

function wlPill(dig,trad){
  if(dig==null||trad==null) return '<span class="pill na">N/D</span>';
  const d=((dig-trad)*100),ds=d.toFixed(1),sign=d>0?'+':'';
  if(d>0.05)  return `<span class="pill win">▲ ${sign}${ds} pp</span>`;
  if(d<-0.05) return `<span class="pill loss">▼ ${ds} pp</span>`;
  return `<span class="pill tie">= 0 pp</span>`;
}

function wlBanner(efDig,efTrad){
  if(efDig==null||efTrad==null) return '';
  const d=((efDig-efTrad)*100),ds=d.toFixed(1),sign=d>0?'+':'';
  if(d>0.05)  return `<div class="wl-banner winning animate animate-1"><span class="wl-icon">✅</span><span class="wl-text">Canal Digital <strong>gana</strong> vs Tradicional</span><span class="wl-diff">${sign}${ds} pp</span></div>`;
  if(d<-0.05) return `<div class="wl-banner losing animate animate-1"><span class="wl-icon">⚠️</span><span class="wl-text">Canal Digital <strong>pierde</strong> vs Tradicional</span><span class="wl-diff">${ds} pp</span></div>`;
  return `<div class="wl-banner tied animate animate-1"><span class="wl-icon">➖</span><span class="wl-text">Canal Digital <strong>empata</strong> con Tradicional</span><span class="wl-diff">0 pp</span></div>`;
}

function kpiCard(entity,label,val,sub,efDig,efTrad){
  let comp='';
  if(efDig!==undefined){
    comp=`<div class="kpi-trad"><span class="kpi-trad-label">Trad&nbsp;</span><span class="kpi-trad-val">${efTrad!=null?fmt.pct(efTrad):'N/D'}</span>&nbsp;${wlPill(efDig,efTrad)}</div>`;
  }
  return `<div class="kpi-card ${entity}"><div class="kpi-label">${label}</div><div class="kpi-value">${val}</div><div class="kpi-sub">${sub}</div>${comp}</div>`;
}

function kpiGrid4(entity,t){
  const e=entity,ef=t.efectividad,part=t.participacion;
  const subCli=part?`Part. ${fmt.pct(part.digital)}`:'Canal Digital';
  return `<div class="kpi-grid animate animate-2">
    ${kpiCard(e,'Clientes Dig.',     fmt.num(t.clientes.digital), subCli)}
    ${kpiCard(e,'Efectividad Dig.',  fmt.pct(ef.digital),         `vs Trad ${fmt.pct(ef.trad)}`,ef.digital,ef.trad)}
    ${kpiCard(e,'Deuda Vencida',     t.dv.digital!=null?t.dv.digital.toFixed(2):'—','S/ MM · Digital')}
    ${kpiCard(e,'Recupero Dig.',     t.recupero.digital!=null?t.recupero.digital.toFixed(3):'—','S/ MM · Digital')}
  </div>`;
}

function tHead(){
  return `<thead><tr>
    <th>Nivel</th>
    <th>Cli. Dig.</th><th>Cli. Trad.</th>
    <th>Efect. Dig.</th><th>Efect. Trad.</th><th class="gap-cell">Dif.</th>
    <th>DV Dig.</th><th>Rec. Dig.</th>
  </tr></thead>`;
}
function tRow(label,d,entity,navView){
  const ef=d.efectividad||{};
  const cls=navView?'class="clickable"':'';
  const click=navView?`onclick="navigate('${navView}')"`:'';
  return `<tr ${cls} ${click}>
    <td>${label}</td>
    <td class="val-${entity}">${fmt.num(d.clientes.digital)}</td>
    <td>${fmt.num(d.clientes.trad)}</td>
    <td><span class="pill ${entity}">${fmt.pct(ef.digital)}</span></td>
    <td><span class="pill trad">${fmt.pct(ef.trad)}</span></td>
    <td class="gap-cell">${wlPill(ef.digital,ef.trad)}</td>
    <td>${fmt.mm(d.dv?.digital)}</td>
    <td>${fmt.mm(d.recupero?.digital)}</td>
  </tr>`;
}

function barChart(canvasId,labels,digData,tradData,color){

  const ctx=document.getElementById(canvasId)?.getContext('2d'); if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'Digital',    data:digData, backgroundColor:color,borderRadius:4,borderSkipped:false},
    {label:'Tradicional',data:tradData,backgroundColor:pale, borderRadius:4,borderSkipped:false,borderColor:color,borderWidth:1.5}
  ]},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.8,plugins:{
    legend:{labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,usePointStyle:true,pointStyle:'rect'}},
    tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:9,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11},callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y!=null?c.parsed.y.toFixed(1)+'%':'N/D'}`}}
  },scales:{
    x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},
    y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280',callback:v=>v+'%'},border:{dash:[4,4]}}
  }}});
  chartInstances.push(c);
}

function lineChart(canvasId){
  const e=currentEntity;
  const labels=['1–30','31–60','61–90','91–120'];
  const keys=['1-30','31-60','61-90','91-120'];
  const getEf=(k,canal)=>{
    const r=DATA[e][k]; if(!r)return null;
    const s=r.total||r;
    const v=canal==='digital'?s.efectividad?.digital:s.efectividad?.trad;
    return v!=null?+(v*100).toFixed(2):null;
  };
  const isBCP=e==='bcp';
  const colorDig =isBCP?'#1a5fd4':'#e0500a';
  const colorTrad=isBCP?'#93b4f0':'#f4a97a';
  const bgDig    =isBCP?'rgba(26,95,212,0.07)':'rgba(224,80,10,0.07)';
  const labelDig =isBCP?'BCP · Digital':'Yape · Digital';
  const labelTrad=isBCP?'BCP · Tradicional':'Yape · Tradicional';
  const ctx=document.getElementById(canvasId)?.getContext('2d'); if(!ctx)return;
  const c=new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:labelDig,  data:keys.map(k=>getEf(k,'digital')), borderColor:colorDig,  backgroundColor:bgDig,        borderWidth:2.5, pointBackgroundColor:colorDig,  pointStyle:'circle',  pointRadius:4, pointHoverRadius:7, fill:true,  tension:0.35},
    {label:labelTrad, data:keys.map(k=>getEf(k,'trad')),    borderColor:colorTrad, backgroundColor:'transparent', borderWidth:2,   pointBackgroundColor:colorTrad, pointStyle:'rectRot', pointRadius:4, pointHoverRadius:7, fill:false, tension:0.35, borderDash:[6,3]}
  ]},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.8,
    plugins:{
      legend:{position:'bottom',labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,boxHeight:2,padding:14,usePointStyle:true}},
      tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:10,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11},callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y!=null?c.parsed.y.toFixed(1)+'%':'N/D'}`}}
    },
    scales:{
      x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},
      y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280',callback:v=>v+'%'},border:{dash:[4,4]}}
    }
  }});
  chartInstances.push(c);
}

function chartsRow(id1,title1,sub1,id2){
  return `<div class="charts-row animate animate-3">
    <div class="chart-card"><div class="chart-title">${title1}</div><div class="chart-sub">${sub1}</div><canvas id="${id1}" height="140"></canvas></div>
    <div class="chart-card"><div class="chart-title">Tendencia · Dig vs Trad</div><div class="chart-sub">BCP y Yape · Digital vs Tradicional por tramo</div><canvas id="${id2}" height="160"></canvas></div>
  </div>`;
}

// ══════════════════════════════════════════════════
//  BREADCRUMB
// ══════════════════════════════════════════════════
function buildBC(view){
  const m={'total':[{l:'Resumen',c:true}],'1-30-total':[{l:'1–30'},{l:'Resumen',c:true}],'31-60-total':[{l:'31–60'},{l:'Resumen',c:true}],'61-90-total':[{l:'61–90'},{l:'Resumen',c:true}],'91-120-total':[{l:'91–120'},{l:'Resumen',c:true}],'plus120-total':[{l:'+120'},{l:'Resumen',c:true}]};
  if(m[view])return m[view];
  if(view.match(/^seg-[abcd]-total$/)) return [{l:'1–30'},{l:`Seg ${view[4].toUpperCase()}`},{l:'Resumen',c:true}];
  if(view.match(/^seg-[abcd]-/)){ const tk=view.replace(/^seg-[abcd]-/,''); return [{l:'1–30'},{l:`Seg ${view[4].toUpperCase()}`},{l:TL[tk]||tk,c:true}]; }
  if(view.match(/^31-60-/)){ const tk=view.replace('31-60-',''); return [{l:'31–60'},{l:TL[tk]||tk,c:true}]; }
  if(view.match(/^plus120-/)){ const tk=view.replace('plus120-',''); return [{l:'+120'},{l:TL[tk]||tk,c:true}]; }
  return [{l:view,c:true}];
}
function bcHtml(view){
  const e=currentEntity;
  return `<div class="breadcrumb animate"><span class="bc-dot ${e}"></span>${e.toUpperCase()}${buildBC(view).map(p=>`<span class="bc-sep">›</span><span class="bc-item ${p.c?'current':''}">${p.l}</span>`).join('')}</div>`;
}

// ══════════════════════════════════════════════════
//  NAV
// ══════════════════════════════════════════════════
function setEntity(e){
  currentEntity=e;
  document.getElementById('tab-bcp').className ='entity-tab bcp' +(e==='bcp' ?' active':'');
  document.getElementById('tab-yape').className='entity-tab yape'+(e==='yape'?' active':'');
  document.getElementById('nav-plus120-item').style.display=e==='yape'?'none':'';
  const v=(e==='yape'&&(currentView.startsWith('plus120')||currentView.startsWith('seg-')))?'total':currentView;
  clearActive(); navigate(v);
}
function clearActive(){ document.querySelectorAll('.tramo-btn,.sub-btn,.subsub-btn').forEach(b=>b.classList.remove('active-bcp','active-yape')); }
function toggleTramo(t){ const s=document.getElementById('sub-'+t),b=document.getElementById('nav-'+t); if(!s)return; s.classList.toggle('open'); if(b)b.classList.toggle('expanded',s.classList.contains('open')); }
function toggleSeg(seg){ const s=document.getElementById('subsub-'+seg); if(!s)return; s.classList.toggle('open'); const b=document.getElementById('nav-'+seg); if(b&&s.classList.contains('open'))b.classList.add('active-'+currentEntity); }
function navigate(view){
  currentView=view; clearActive(); destroyCharts();
  const el=document.getElementById('nav-'+view); if(el)el.classList.add('active-'+currentEntity);
  document.getElementById('rightPanel').scrollTop=0;
  renderView(view);
}

// ══════════════════════════════════════════════════
//  RENDER ROUTER
// ══════════════════════════════════════════════════
function renderView(view){
  const p=document.getElementById('rightPanel'),e=currentEntity,d=DATA[e];
  if(view==='total')       {renderTotal(p,e,d);return;}
  if(view==='1-30-total')  {render130(p,e,d);return;}
  if(view.match(/^seg-[abcd]-total$/))  {renderSegTotal(p,e,d,view);return;}
  if(view.match(/^seg-[abcd]-\w/))      {renderTicketDet(p,e,d,view);return;}
  if(['31-60-total','61-90-total','91-120-total','plus120-total'].includes(view)){renderTramoTotal(p,e,d,view);return;}
  if(view.match(/^31-60-\w/)||view.match(/^plus120-\w/)){renderTramoTicket(p,e,d,view);return;}
  p.innerHTML=bcHtml(view)+'<div class="no-data"><span>🔍</span>Vista no encontrada</div>';
}

// ──────────────────────────────────────────
function renderTotal(p,e,d){
  const isYape=e==='yape';
  const tramos=isYape
    ?[{l:'1–30',k:'1-30',n:'1-30-total'},{l:'31–60',k:'31-60',n:'31-60-total'},{l:'61–90',k:'61-90',n:'61-90-total'},{l:'91–120',k:'91-120',n:'91-120-total'}]
    :[{l:'1–30',k:'1-30',n:'1-30-total'},{l:'31–60',k:'31-60',n:'31-60-total'},{l:'61–90',k:'61-90',n:'61-90-total'},{l:'91–120',k:'91-120',n:'91-120-total'},{l:'+120',k:'plus120',n:'plus120-total'}];
  const getD=k=>{const r=d[k];return r?.total||r;};
  const t1120=d['1-120'];
  const totDV=tramos.reduce((s,t)=>s+(getD(t.k)?.dv.digital||0),0);
  const totRec=tramos.reduce((s,t)=>s+(getD(t.k)?.recupero.digital||0),0);
  const part=t1120?.participacion?.digital;
  const insightTxt=isYape?'100% Canal Digital · Sin cartera Tradicional':`Part. Digital Activa 1–120: ${fmt.pct(part)} del total`;
  const rows=tramos.map(t=>tRow(t.l,getD(t.k),e,t.n)).join('');
  const color=e==='bcp'?'#1a5fd4':'#e0500a';

  p.innerHTML=`${bcHtml('total')}
    <div class="section-header animate">
      <div class="section-title ${e}">${e.toUpperCase()}</div>
      <div class="section-subtitle">Vista Consolidada · 07/05/2026</div>
    </div>
    <div class="insight-strip animate animate-1">
      <div class="insight-chip"><span class="ic-dot ${e}"></span>${insightTxt}</div>
      ${isYape?'<div class="insight-chip" style="border-color:rgba(185,28,28,.2);color:#92400e;">ℹ Sin tramo +120</div>':''}
    </div>
    ${wlBanner(t1120?.efectividad?.digital,t1120?.efectividad?.trad)}
    <div class="kpi-grid animate animate-2">
      ${kpiCard(e,'Clientes Dig. 1–120',fmt.num(t1120?.clientes.digital),`Part. ${fmt.pct(part)}`)}
      ${kpiCard(e,'Efectividad 1–120',fmt.pct(t1120?.efectividad?.digital),`vs Trad ${fmt.pct(t1120?.efectividad?.trad)}`,t1120?.efectividad?.digital,t1120?.efectividad?.trad)}
      ${kpiCard(e,'Deuda Vencida',totDV.toFixed(2),'S/ MM · total tramos')}
      ${kpiCard(e,'Recupero Dig.',totRec.toFixed(3),'S/ MM · total tramos')}
    </div>
    ${chartsRow('chartBar','Efectividad por Tramo · Dig vs Trad',`${e.toUpperCase()} · Comparativo canales`,'chartLine')}
    <div class="data-section animate animate-4">
      <div class="data-section-header"><div class="data-section-title">Por Tramo de Mora</div><div class="data-badge">Toca fila → zoom</div></div>
      <div class="table-scroll"><table>${tHead()}<tbody>${rows}</tbody></table></div>
    </div>`;

  requestAnimationFrame(()=>{
    const keys=isYape?['1-30','31-60','61-90','91-120']:['1-30','31-60','61-90','91-120','plus120'];
    const lbls=isYape?['1–30','31–60','61–90','91–120']:['1–30','31–60','61–90','91–120','+120'];
    const getEf=k=>{const r=d[k];if(!r)return{dig:null,trad:null};const s=r.total||r;return{dig:s.efectividad?.digital,trad:s.efectividad?.trad};};
    barChart('chartBar',lbls,keys.map(k=>getEf(k).dig!=null?+(getEf(k).dig*100).toFixed(1):null),keys.map(k=>getEf(k).trad!=null?+(getEf(k).trad*100).toFixed(1):null),color);
    lineChart('chartLine');
  });
}

function render130(p,e,d){
  const t=d['1-30'],isYape=e==='yape';
  const color=e==='bcp'?'#1a5fd4':'#e0500a';
  let body='';
  if(!isYape&&d.segments){
    const rows=Object.entries(d.segments).map(([sk,seg])=>tRow(seg.label,seg,e,`${sk}-total`)).join('');
    body=`<div class="data-section animate animate-4"><div class="data-section-header"><div class="data-section-title">Por Segmento</div><div class="data-badge">Toca → tickets</div></div><div class="table-scroll"><table>${tHead()}<tbody>${rows}</tbody></table></div></div>`;
  } else {
    body=`<div class="data-section animate animate-4"><div class="data-section-header"><div class="data-section-title">Tramo 1–30 · Yape</div></div><div class="table-scroll"><table>${tHead()}<tbody>${tRow('1–30',t,e,null)}</tbody></table></div></div>`;
  }
  p.innerHTML=`${bcHtml('1-30-total')}
    <div class="section-header animate"><div class="section-title ${e}">1 – 30</div><div class="section-subtitle">${e.toUpperCase()} · ${isYape?'Canal Digital':'Segmentos A/B/C/D'}</div></div>
    ${wlBanner(t.efectividad.digital,t.efectividad.trad)}
    ${kpiGrid4(e,t)}
    ${chartsRow('chartSeg',isYape?'Efectividad Yape 1–30':'Efectividad por Segmento',`${e.toUpperCase()} · Digital vs Trad`,'chartLine2')}
    ${body}`;
  requestAnimationFrame(()=>{
    let lbls,dig,trad;
    if(!isYape&&d.segments){const segs=Object.values(d.segments);lbls=segs.map(s=>s.label.replace('Segmento ','Seg '));dig=segs.map(s=>+(s.efectividad.digital*100).toFixed(1));trad=segs.map(s=>+(s.efectividad.trad*100).toFixed(1));}
    else{lbls=['1–30'];dig=[+(t.efectividad.digital*100).toFixed(1)];trad=[t.efectividad.trad!=null?+(t.efectividad.trad*100).toFixed(1):null];}
    barChart('chartSeg',lbls,dig,trad,color);
    lineChart('chartLine2');
  });
}

function renderSegTotal(p,e,d,view){
  if(e==='yape'){p.innerHTML=bcHtml(view)+'<div class="no-data"><span>ℹ️</span>Yape no tiene segmentos</div>';return;}
  const sk=view.replace('-total',''),seg=d.segments[sk];
  const rows=Object.entries(seg.tickets).map(([tk,tv])=>tRow(tl(tk),tv,e,`${sk}-${tk}`)).join('');
  p.innerHTML=`${bcHtml(view)}
    <div class="section-header animate"><div class="section-title bcp">${seg.label}</div><div class="section-subtitle">BCP · Tramo 1–30</div></div>
    ${wlBanner(seg.efectividad.digital,seg.efectividad.trad)}
    ${kpiGrid4(e,seg)}
    ${chartsRow('chartSegTk','Efectividad por Ticket',`${seg.label} · Digital vs Trad`,'chartLine3')}
    <div class="data-section animate animate-4"><div class="data-section-header"><div class="data-section-title">Tickets de Deuda</div><div class="data-badge">Toca → detalle</div></div><div class="table-scroll"><table>${tHead()}<tbody>${rows}</tbody></table></div></div>`;
  requestAnimationFrame(()=>{
    const tks=Object.entries(seg.tickets);
    barChart('chartSegTk',tks.map(([k])=>TL[k]||k),tks.map(([,v])=>v.efectividad.digital!=null?+(v.efectividad.digital*100).toFixed(1):null),tks.map(([,v])=>v.efectividad.trad!=null?+(v.efectividad.trad*100).toFixed(1):null),'#1a5fd4');
    lineChart('chartLine3');
  });
}

function renderTicketDet(p,e,d,view){
  if(e==='yape'){p.innerHTML=bcHtml(view)+'<div class="no-data"><span>ℹ️</span>Yape no tiene segmentos</div>';return;}
  const m=view.match(/^(seg-[abcd])-(.+)$/),sk=m[1],tk=m[2];
  const seg=d.segments[sk],tv=seg.tickets[tk];
  if(!tv){p.innerHTML=bcHtml(view)+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  p.innerHTML=`${bcHtml(view)}
    <div class="section-header animate"><div class="section-title bcp">${tl(tk)}</div><div class="section-subtitle">${seg.label} · 1–30</div></div>
    ${wlBanner(tv.efectividad.digital,tv.efectividad.trad)}
    ${kpiGrid4(e,tv)}
    <div class="data-section animate animate-3"><div class="data-section-header"><div class="data-section-title">Digital vs Tradicional</div></div><div class="table-scroll"><table>${tHead()}<tbody>${tRow(tl(tk),tv,e,null)}</tbody></table></div></div>`;
}

function renderTramoTotal(p,e,d,view){
  const tk=view.replace('-total','');
  if(tk==='plus120'&&e==='yape'){p.innerHTML=bcHtml(view)+'<div class="no-data"><span>🚫</span>Yape no opera en +120</div>';return;}
  const rec=tk==='plus120'?d.plus120:d[tk];
  const t=rec.total;
  const td=tk.replace('plus','+').replace('-','–');
  const hasTk=!!rec.tickets;
  const color=e==='bcp'?'#1a5fd4':'#e0500a';
  let tickHtml='';
  if(hasTk){const rows=Object.entries(rec.tickets).map(([k,v])=>tRow(tl(k),v,e,`${tk}-${k}`)).join('');tickHtml=`<div class="data-section animate animate-4"><div class="data-section-header"><div class="data-section-title">Tickets de Deuda</div><div class="data-badge">Toca → detalle</div></div><div class="table-scroll"><table>${tHead()}<tbody>${rows}</tbody></table></div></div>`;}
  else{tickHtml=`<div class="data-section animate animate-4"><div class="data-section-header"><div class="data-section-title">Indicadores</div><div class="data-badge">Sin desglose por ticket</div></div><div class="table-scroll"><table>${tHead()}<tbody>${tRow('Total',t,e,null)}</tbody></table></div></div>`;}

  p.innerHTML=`${bcHtml(view)}
    <div class="section-header animate"><div class="section-title ${e}">${td}</div><div class="section-subtitle">${e.toUpperCase()} · Tramo de Mora</div></div>
    ${wlBanner(t.efectividad.digital,t.efectividad.trad)}
    ${kpiGrid4(e,t)}
    ${chartsRow('chartTrm',hasTk?'Efectividad por Ticket':('Efectividad Tramo '+td),`${e.toUpperCase()} · Digital vs Trad`,'chartLine4')}
    ${tickHtml}`;
  requestAnimationFrame(()=>{
    if(hasTk){const tks=Object.entries(rec.tickets);barChart('chartTrm',tks.map(([k])=>TL[k]||k),tks.map(([,v])=>v.efectividad.digital!=null?+(v.efectividad.digital*100).toFixed(1):null),tks.map(([,v])=>v.efectividad.trad!=null?+(v.efectividad.trad*100).toFixed(1):null),color);}
    else{barChart('chartTrm',[`Tramo ${td}`],[t.efectividad.digital!=null?+(t.efectividad.digital*100).toFixed(1):null],[t.efectividad.trad!=null?+(t.efectividad.trad*100).toFixed(1):null],color);}
    lineChart('chartLine4');
  });
}

function renderTramoTicket(p,e,d,view){
  let tramoKey,tk;
  if(view.startsWith('plus120-')){tramoKey='plus120';tk=view.replace('plus120-','');}
  else{const m=view.match(/^(\d+-\d+)-(.+)$/);tramoKey=m[1];tk=m[2];}
  const tickets=tramoKey==='plus120'?d.plus120.tickets:d[tramoKey]?.tickets;
  if(!tickets||!tickets[tk]){p.innerHTML=bcHtml(view)+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  const tv=tickets[tk];
  const td=tramoKey.replace('plus','+').replace('-','–');
  p.innerHTML=`${bcHtml(view)}
    <div class="section-header animate"><div class="section-title ${e}">${tl(tk)}</div><div class="section-subtitle">${e.toUpperCase()} · Tramo ${td}</div></div>
    ${wlBanner(tv.efectividad.digital,tv.efectividad.trad)}
    ${kpiGrid4(e,tv)}
    <div class="data-section animate animate-3"><div class="data-section-header"><div class="data-section-title">Digital vs Tradicional</div></div><div class="table-scroll"><table>${tHead()}<tbody>${tRow(tl(tk),tv,e,null)}</tbody></table></div></div>`;
}

// INIT
navigate('total');
document.getElementById('nav-total').classList.add('active-bcp');
</script>
